name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Java for Spring Boot Backend
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 2. Start Spring Boot Backend in Background (Test Profile)
      - name: Build and Start Backend
        run: |
          ./mvnw spring-boot:run -Dspring-boot.run.profiles=test &
        # Backend folder agar alag directory me hai toh 'working-directory: backend' add karein

      # 3. Setup Node.js for Frontend
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 4. Install Frontend Dependencies
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 5. Install Playwright Chromium Browser
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # 6. Start Frontend Server in Background
      - name: Start Frontend Server
        working-directory: frontend
        run: npm run dev &

      # 7. Wait for Servers to be Ready
      - name: Wait for Frontend & Backend
        run: |
          npx wait-on http://localhost:3000 http://localhost:8080 --timeout 60000

      # 8. Run Playwright Tests with Secrets
      - name: Run Playwright tests
        working-directory: frontend
        env:
          MAILTRAP_API_TOKEN: "${{ secrets.MAILTRAP_API_TOKEN }}"
          MAILTRAP_INBOX_ID: "${{ secrets.MAILTRAP_INBOX_ID }}"
        run: npx playwright test --project=chromium

      # 9. Upload Playwright Report
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14